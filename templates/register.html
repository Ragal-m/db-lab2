{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="bg-white dark:bg-slate-800 p-6 sm:p-8 rounded-xl shadow border border-slate-200 dark:border-slate-700 transition-colors">
  <h2 class="text-2xl font-bold text-center mb-6 text-slate-800 dark:text-white">Create an Account</h2>

  <div id="client-errors" class="hidden mb-4 p-3 bg-red-100 dark:bg-red-900/40 border border-red-300 dark:border-red-700 text-red-700 dark:text-red-300 rounded-lg text-sm space-y-1"></div>

  {% if errors %}
  <div class="mb-4 p-3 bg-red-100 dark:bg-red-900/40 border border-red-300 dark:border-red-700 text-red-700 dark:text-red-300 rounded-lg text-sm space-y-1">
    {% for err in errors %}
      <p>• {{ err }}</p>
    {% endfor %}
  </div>
  {% endif %}

  <form id="register-form" action="{{ url_for('register') }}" method="POST" novalidate class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Name</label>
      <input type="text" id="name" name="name" value="{{ form_data.name if form_data else '' }}"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Email</label>
      <input type="email" id="email" name="email" value="{{ form_data.email if form_data else '' }}"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Password</label>
      <input type="password" id="password" name="password"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700 dark:text-slate-300">Confirm password</label>
      <input type="password" id="confirm_password" name="confirm_password"
             class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>
    <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition duration-150">
      Register
    </button>
  </form>
  <p class="mt-4 text-center text-sm text-slate-600 dark:text-slate-400">
    Already have an account? <a href="{{ url_for('login') }}" class="text-blue-600 dark:text-blue-400 hover:underline">Log in</a>
  </p>
</div>

<script>
document.getElementById('register-form').addEventListener('submit', function(e) {
  const errBox = document.getElementById('client-errors');
  errBox.innerHTML = '';
  const messages = [];

  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirm_password').value;

  if (!name) messages.push('Name is required');
  if (!email) messages.push('Email is required');
  if (!password) messages.push('Password is required');
  if (!confirmPassword) messages.push('Confirm password is required');
  if (password && confirmPassword && password !== confirmPassword) {
    messages.push('Passwords do not match');
  }

  if (messages.length > 0) {
    e.preventDefault();
    errBox.innerHTML = messages.map(m => `<p>• ${m}</p>`).join('');
    errBox.classList.remove('hidden');
  }
});
</script>
{% endblock %}
